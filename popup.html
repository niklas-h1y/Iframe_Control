<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>iFrame Permissions</title>
  <style>
    body { font-family: sans-serif; width: 220px; padding: 10px; background: #f6f8fa; }
    h3 { margin: 0 0 10px 0; font-size: 14px; border-bottom: 1px solid #ddd; padding-bottom: 5px; }
    .toggle-container { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
    .label { font-size: 12px; }
    .switch { position: relative; display: inline-block; width: 34px; height: 20px; }
    .switch input { opacity: 0; width: 0; height: 0; }
    .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: #ccc; transition: .2s; border-radius: 20px; }
    .slider:before { position: absolute; content: ""; height: 14px; width: 14px; left: 3px; bottom: 3px; background-color: white; transition: .2s; border-radius: 50%; }
    input:checked + .slider { background-color: #2da44e; }
    input:checked + .slider:before { transform: translateX(14px); }
    button { width: 100%; background: #0969da; color: white; border: none; padding: 6px; border-radius: 6px; font-weight: bold; cursor: pointer; margin-top: 5px; }
  </style>
</head>
<body>
  <h3>iFrame Sandbox Flags</h3>
  <div class="toggle-container"><span class="label">Allow Scripts</span><label class="switch"><input type="checkbox" id="allow-scripts" checked><span class="slider"></span></label></div>
  <div class="toggle-container"><span class="label">Allow Same-Origin</span><label class="switch"><input type="checkbox" id="allow-same-origin" checked><span class="slider"></span></label></div>
  <div class="toggle-container"><span class="label">Allow Popups</span><label class="switch"><input type="checkbox" id="allow-popups" checked><span class="slider"></span></label></div>
  <div class="toggle-container"><span class="label">Allow Forms</span><label class="switch"><input type="checkbox" id="allow-forms" checked><span class="slider"></span></label></div>
  <button id="apply-btn">Apply to Page</button>
  <script src="popup.js"></script>
</body>
</html>
